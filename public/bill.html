<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🪶 RAVEN — Split the Bill</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Epilogue:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #06060A;
      --dark: #0C0C12;
      --dark2: #13131A;
      --dark3: #1A1A24;
      --dark4: #20202E;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --white: #F0EEF8;
      --muted: #6E6B80;
      --muted2: #9896A8;
      --raven: #7C3AED;
      --raven2: #A855F7;
      --raven3: #C084FC;
      --sms: #30D158;
      --sms-dim: rgba(48,209,88,0.12);
      --sms-glow: rgba(48,209,88,0.25);
      --ember: #FF6B35;
      --red: #FF4444;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Epilogue', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      padding-bottom: 120px;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 900;
      opacity: 0.35;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6,6,10,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
    }
    .header-inner {
      max-width: 480px;
      margin: 0 auto;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .header-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 0.2em;
      background: linear-gradient(135deg, var(--white) 20%, var(--raven3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-bill-id {
      font-size: 11px;
      color: var(--muted);
      background: var(--dark3);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .bill-info {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 0;
    }
    .bill-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 0.04em;
      line-height: 1;
      margin-bottom: 6px;
    }
    .bill-meta {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .bill-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .bill-tag span { color: var(--white); font-weight: 600; }
    .progress-wrap {
      max-width: 480px;
      margin: 20px auto 0;
      padding: 0 20px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .progress-bar {
      height: 3px;
      background: var(--dark3);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sms), var(--raven2));
      border-radius: 2px;
      transition: width 0.5s ease;
    }
    .name-section {
      max-width: 480px;
      margin: 24px auto 0;
      padding: 0 20px;
    }
    .name-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }
    .name-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--dark2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      color: var(--white);
      font-family: 'Epilogue', sans-serif;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .name-input:focus {
      border-color: var(--sms);
      box-shadow: 0 0 0 3px rgba(48,209,88,0.1);
    }
    .name-input::placeholder { color: var(--muted); font-weight: 400; }
    .section-label {
      max-width: 480px;
      margin: 28px auto 0;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-label h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 600;
    }
    .section-label .count { font-size: 11px; color: var(--muted); }
    .section-label .count span { color: var(--sms); font-weight: 700; }
    .items-list {
      max-width: 480px;
      margin: 10px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--dark2);
      border: 2px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .item-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 0% 50%, rgba(48,209,88,0.06), transparent 70%);
      opacity: 0;
      transition: opacity 0.18s;
    }
    .item-card:active { transform: scale(0.98); }
    .item-card.selected { border-color: var(--sms); background: var(--dark3); }
    .item-card.selected::before { opacity: 1; }
    .item-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.18s;
      font-size: 13px;
      color: transparent;
    }
    .item-card.selected .item-check {
      background: var(--sms);
      border-color: var(--sms);
      color: #000;
      font-weight: 700;
    }
    .item-body { flex: 1; min-width: 0; }
    .item-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-claimers {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }
    .item-price {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 0.04em;
      color: var(--raven3);
      flex-shrink: 0;
      transition: color 0.18s;
    }
    .item-card.selected .item-price { color: var(--sms); }
    .extras-section {
      max-width: 480px;
      margin: 28px auto 0;
      padding: 0 20px;
    }
    .extras-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }
    .extras-card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .extra-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .extra-row:last-child { border-bottom: none; }
    .extra-label { font-size: 14px; color: var(--muted2); }
    .extra-value { font-size: 14px; font-weight: 600; color: var(--white); }
    .extra-note { font-size: 11px; color: var(--muted); }
    .summary-section {
      max-width: 480px;
      margin: 28px auto 0;
      padding: 0 20px;
    }
    .summary-card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-label { font-size: 14px; color: var(--muted2); }
    .summary-value { font-size: 14px; font-weight: 600; color: var(--white); }
    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 16px;
      background: linear-gradient(135deg, rgba(48,209,88,0.06), rgba(124,58,237,0.06));
      border-top: 1px solid var(--border);
    }
    .summary-total-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 0.08em;
      color: var(--muted2);
    }
    .summary-total-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 0.04em;
      color: var(--sms);
    }
    .submit-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      padding: 16px 20px;
      background: linear-gradient(to top, rgba(6,6,10,1) 60%, transparent);
    }
    .submit-inner { max-width: 480px; margin: 0 auto; }
    .submit-btn {
      width: 100%;
      padding: 17px;
      background: var(--sms);
      border: none;
      border-radius: 14px;
      color: #000;
      font-family: 'Epilogue', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 30px var(--sms-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .submit-btn:hover { background: #3ddd68; transform: translateY(-1px); }
    .submit-btn:active { transform: scale(0.99); }
    .submit-btn:disabled {
      background: var(--dark3);
      color: var(--muted);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .submit-btn.success {
      background: var(--raven);
      color: var(--white);
      box-shadow: 0 8px 30px rgba(124,58,237,0.3);
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--dark3);
      border: 1px solid var(--border2);
      color: var(--white);
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transition: all 0.3s ease;
      white-space: nowrap;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(255,68,68,0.4); color: #FF6B6B; }
    .toast.success-toast { border-color: rgba(48,209,88,0.4); color: var(--sms); }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: slideUp 0.4s ease both; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-inner">
      <a class="header-brand" href="/">
        <svg width="22" height="22" viewBox="0 0 200 200" fill="none">
          <path d="M85 95 C70 90 45 88 28 78 C20 73 15 65 18 58 C22 50 32 48 42 52 C50 55 56 62 62 70 C68 78 74 86 85 95Z" fill="url(#hg)" opacity="0.8"/>
          <path d="M115 95 C130 90 155 88 172 78 C180 73 185 65 182 58 C178 50 168 48 158 52 C150 55 144 62 138 70 C132 78 126 86 115 95Z" fill="url(#hg)" opacity="0.8"/>
          <path d="M75 100 C68 108 65 118 66 128 C67 140 72 150 80 156 C87 161 93 160 100 158 C107 160 113 161 120 156 C128 150 133 140 134 128 C135 118 132 108 125 100 C118 92 108 88 100 88 C92 88 82 92 75 100Z" fill="url(#hg)"/>
          <path d="M78 72 C76 60 80 48 88 40 C94 34 100 32 106 34 C116 37 122 46 122 56 C122 66 118 76 112 83 C108 88 104 90 100 90 C93 90 86 85 82 80 C80 77 79 75 78 72Z" fill="url(#hg)"/>
          <path d="M78 72 C72 68 62 66 56 68 C52 70 51 74 54 77 C58 80 65 79 72 76Z" fill="#C084FC"/>
          <ellipse cx="97" cy="58" rx="5" ry="4.5" fill="#FF6B00" opacity="0.9"/>
          <defs>
            <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#A855F7"/>
              <stop offset="100%" stop-color="#30D158"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="header-logo">RAVEN</span>
      </a>
      <div class="header-bill-id" id="headerBillId">Loading...</div>
    </div>
  </div>

  <div id="app">
    BILL_CONTENT_PLACEHOLDER
  </div>

  <div class="submit-wrap" id="submitWrap">
    <div class="submit-inner">
      <button class="submit-btn" id="submitBtn" onclick="submitSelections()">
        <span id="submitBtnText">Confirm My Order</span>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const selected = new Set();
    let submitted = false;

    function formatMoney(n) {
      return '$' + parseFloat(n).toFixed(2);
    }

    function toggleItem(itemId, price) {
      if (submitted) return;
      const card = document.getElementById('item-' + itemId);
      if (!card) return;
      if (selected.has(itemId)) {
        selected.delete(itemId);
        card.classList.remove('selected');
      } else {
        selected.add(itemId);
        card.classList.add('selected');
      }
      updateSummary();
    }

    function updateSummary() {
      const TAX = parseFloat(document.getElementById('taxAmount')?.dataset.value || 0);
      const TIP = parseFloat(document.getElementById('tipAmount')?.dataset.value || 0);
      const PEOPLE = parseInt(document.getElementById('peopleCount')?.dataset.value || 1);

      let itemsTotal = 0;
      selected.forEach(id => {
        const card = document.getElementById('item-' + id);
        if (card) itemsTotal += parseFloat(card.dataset.price);
      });

      const myTax = TAX / Math.max(PEOPLE, 1);
      const myTip = TIP / Math.max(PEOPLE, 1);
      const myTotal = itemsTotal + myTax + myTip;

      const el = document.getElementById('itemsSubtotal');
      const totalEl = document.getElementById('myTotalAmount');
      if (el) el.textContent = formatMoney(itemsTotal);
      if (totalEl) totalEl.textContent = formatMoney(myTotal);

      const countEl = document.getElementById('selectedCount');
      if (countEl) countEl.textContent = selected.size;
    }

    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    async function submitSelections() {
      if (submitted) return;
      const name = document.getElementById('userName')?.value?.trim();
      const BILL_ID = document.getElementById('billIdData')?.dataset.value;

      if (!name) { showToast('Enter your name first ☝️', 'error'); return; }
      if (selected.size === 0) { showToast('Tap what you ordered 👆', 'error'); return; }

      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('submitBtnText');
      btn.disabled = true;
      btnText.textContent = 'Saving...';

      try {
        const res = await fetch(`/bill/${BILL_ID}/select`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, items: Array.from(selected) })
        });
        const data = await res.json();
        if (data.success) {
          submitted = true;
          btn.className = 'submit-btn success';
          btnText.textContent = '✅ Saved! You\'re all set.';
          showToast('Your order is confirmed! 🎉', 'success-toast');
          setTimeout(() => location.reload(), 2000);
        } else {
          btn.disabled = false;
          btnText.textContent = 'Confirm My Order';
          showToast('Something went wrong, try again', 'error');
        }
      } catch(e) {
        btn.disabled = false;
        btnText.textContent = 'Confirm My Order';
        showToast('Connection error, try again', 'error');
      }
    }
  </script>
</body>
</html>
