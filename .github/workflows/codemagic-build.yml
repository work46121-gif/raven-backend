name: Trigger Codemagic iOS Build

on:
  push:
    branches:
      - main
    paths:
      - server.js
      - package.json
      - package-lock.json
  workflow_dispatch:

concurrency:
  group: codemagic-ios-build
  cancel-in-progress: true

jobs:
  start-codemagic-build:
    runs-on: ubuntu-latest
    steps:
      - name: Start Codemagic build
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
        run: |
          test -n "$CODEMAGIC_API_TOKEN"
          test -n "$CODEMAGIC_APP_ID"
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
            --data "{\"appId\":\"$CODEMAGIC_APP_ID\",\"workflowId\":\"raven-ios\",\"branch\":\"main\"}" \
            -X POST https://api.codemagic.io/builds
